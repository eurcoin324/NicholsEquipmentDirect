name: Fix project structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf app lib prisma
          rm -f globals.css layout.tsx page.tsx route.ts
          mkdir -p /tmp/project
          unzip -q NicholsEquipmentDirect-v2.zip -d /tmp/project

          SRC=$(find /tmp/project -mindepth 1 -maxdepth 1 -type d | head -1)

          cp -a "$SRC/." .

          rm -f NicholsEquipmentDirect-v2.zip

      - name: Commit corrected structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix project folder structure" || exit 0
          git push
